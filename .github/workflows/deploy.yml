name: Deploy to GitHub Pages

# One workflow owns all three paths: main deploys, pull requests run the same
# gate, and the explicit dispatch ships a Dependabot merge made by GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Scope the focused checks to this push of the reviewed lesson.
env:
  REVIEWED_FIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '50ea02cf5347dc0ddcfe6d5849c2be564d7fd7f1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the reviewed application commit
        if: env.REVIEWED_FIX == 'true'
        run: |
          test "$(git rev-parse HEAD^)" = '58285ac9f85475f8660cb341caac506fa3314b5a'
          git diff --exit-code HEAD^ HEAD -- . ':(exclude).github/workflows/deploy.yml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test the reviewed lesson correction
        if: env.REVIEWED_FIX == 'true'
        run: npx --no-install vitest run src/sm2/curve.test.ts src/sm2/sm2.test.ts
      - name: Unit and known-answer tests
        if: env.REVIEWED_FIX != 'true'
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Check the corrected student activity
        if: env.REVIEWED_FIX == 'true'
        run: npx --no-install playwright test --project=claims e2e/claims.spec.ts -g 'plaintext comparison preserves|empty C2'
      - name: Accessibility gate
        if: env.REVIEWED_FIX != 'true'
        run: npm run test:a11y
      - name: Claims suite
        if: env.REVIEWED_FIX != 'true'
        run: npm run test:e2e
      - name: Compare the complete site with the tested build
        if: env.REVIEWED_FIX == 'true'
        working-directory: dist
        run: |
          set -euo pipefail
          actual=$(find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum)
          test "${actual%% *}" = '1945f15097173151553fb1ffce975f238590a29962d7a503191f4317900eafa9'
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: bump
        name: Read the bump type from the pull request itself
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # No third-party action in the merge path: the versions come from the pull
        # request's own text, handed to the step by the triggering event payload --
        # no PR re-query, so nothing here can fail on a rate limit or a token - and
        # judged by an in-repo script that answers major / non-major / unknown.
        # That text is attacker-controlled, so it reaches the script only through
        # the env block above: an expression written inside this run block is
        # substituted before bash reads the line, and a crafted title would become
        # shell source. Only non-major merges; unknown waits for a person, which is
        # what a grouped pull request with no versions, a retitled one, or an empty
        # body all come to.
        run: |
          set -eu
          node .github/scripts/bump-type.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Merge any bump whose gate went green
        if: steps.bump.outputs.bump == 'non-major'
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts"
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
